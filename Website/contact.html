    <main class="sheet" id="content">
      <h1>Contact</h1>
      <form class="email-composer" action="mailto:inquiries@skevia.net" method="get" aria-label="Write an email to Skevia" aria-describedby="email-help">
        <div class="composer-toolbar">
          <button class="composer-send" type="submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 3 19 9-19 9 4-9-4-9Z" />
              <path d="M7 12h15" />
            </svg>
            Send
          </button>
          <button class="composer-clear" type="reset" aria-label="Clear draft" title="Clear draft">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7" />
            </svg>
          </button>
        </div>
        <div class="composer-fields">
          <div class="composer-recipient">
            <label for="email-to">To</label>
            <input id="email-to" type="email" value="inquiries@skevia.net" readonly />
          </div>
          <label class="composer-label" for="email-subject">Subject</label>
          <input class="composer-subject" id="email-subject" name="subject" type="text" placeholder="Add a subject" maxlength="200" required />
          <label class="composer-label" for="email-message">Message</label>
          <textarea class="composer-message" id="email-message" name="body" placeholder="Write your message…" rows="12" required></textarea>
        </div>
      </form>
      <p class="composer-help" id="email-help">Send opens your email app with your draft ready to send.</p>
    </main>
    <footer class="footer">
